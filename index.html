<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite - Online Food Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #ff4757;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://unsplash.com') center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 5rem 1rem;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        .menu-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .food-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 1rem;
            text-align: center;
        }
        .food-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
        }
        .order-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
        }
        .order-btn:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <header>
        <h2>QuickBite</h2>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Delicious Food Delivered To Your Door</h1>
        <p>Order your favorite meals from the best local restaurants.</p>
    </section>

    <div class="menu-container" id="menu">
        <h2>Featured Menu</h2>
        <div class="menu-grid">
            <div class="food-card">
                <img src="https://unsplash.com" alt="Cheeseburger">
                <h3>Classic Cheeseburger</h3>
                <p>$8.99</p>
                <button class="order-btn">Add to Cart</button>
            </div>
            <div class="food-card">
                <img src="https://unsplash.com" alt="Pizza">
                <h3>Pepperoni Pizza</h3>
                <p>$12.50</p>
                <button class="order-btn">Add to Cart</button>
            </div>
            <div class="food-card">
                <img src="https://unsplash.com" alt="Salad">
                <h3>Caesar Salad</h3>
                <p>$6.99</p>
                <button class="order-btn">Add to Cart</button>
            </div>
        </div>
    </div>

</body>
</html>
